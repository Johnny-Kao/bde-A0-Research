name: A0 T1 model correctness and perf signal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        compiler: [clang++]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile model
        run: ${{ matrix.compiler }} -std=c++17 -O2 -pthread -Wall -Wextra -Werror tests/a0_model.cpp -o a0_model
      - name: Run correctness and model-only benchmark
        run: ./a0_model
      - name: Record provenance
        run: |
          git rev-parse HEAD
          ${{ matrix.compiler }} --version
