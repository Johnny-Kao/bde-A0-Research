name: A0 T4 real BDE component tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bloomberg/bde
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bloomberg/bde-tools
          path: bde-tools
          persist-credentials: false
      - name: Fingerprint and apply research patch
        run: |
          git -C upstream rev-parse HEAD
          python3 tests/t0_source_probe.py
          python3 scripts/apply_a0_to_bde.py
          git -C upstream diff --check
      - name: Configure and run actual component tests
        working-directory: upstream
        run: |
          export PATH="$GITHUB_WORKSPACE/bde-tools/bin:$PATH"
          eval "$(bbs_build_env -u opt_dbg_64_cpp17)"
          bbs_build configure --regex ball_loggermanager
          bbs_build build --target ball_loggermanager.t --tests run
