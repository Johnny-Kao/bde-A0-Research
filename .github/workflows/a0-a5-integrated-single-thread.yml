name: A0-A5 integrated single-thread correctness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bloomberg/bde
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bloomberg/bde-tools
          path: bde-tools
          persist-credentials: false
      - name: Compose A0-A5 and validate actual BDE
        working-directory: upstream
        run: |
          set -euo pipefail
          echo "UPSTREAM_SHA=$(git rev-parse HEAD)"
          (cd "$GITHUB_WORKSPACE" && python3 scripts/install_single_thread_smoke.py)
          (cd "$GITHUB_WORKSPACE" && python3 scripts/apply_a0_to_bde.py)
          (cd "$GITHUB_WORKSPACE" && python3 scripts/apply_a1_guard.py)
          (cd "$GITHUB_WORKSPACE" && python3 scripts/apply_a2_a5_integrated.py)
          git diff --check
          git diff --stat
          export PATH="$GITHUB_WORKSPACE/bde-tools/bin:$PATH"
          eval "$(bbs_build_env -u opt_dbg_64_cpp17)"
          bbs_build configure --regex ball_loggermanager
          bbs_build build --target ball_loggermanager.t --tests build
          BIN="$(find _build -type f -name 'ball_loggermanager.t' -print -quit)"
          test -n "$BIN"
          "$BIN" 998
          echo "A0_A5_SINGLE_THREAD_PASS"
