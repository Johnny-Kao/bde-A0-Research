name: A0-A5 actual BDE single-thread sanitizers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bloomberg/bde
          ref: 75dcd617380748053bebb30aa6ca73735677e849
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bloomberg/bde-tools
          path: bde-tools
          persist-credentials: false
      - name: Actual BDE instrumented build and case 995
        working-directory: upstream
        run: |
          set -euo pipefail
          (cd "$GITHUB_WORKSPACE" && python3 scripts/install_adversarial_single.py)
          (cd "$GITHUB_WORKSPACE" && python3 scripts/apply_a0_to_bde.py)
          (cd "$GITHUB_WORKSPACE" && python3 scripts/apply_a1_guard.py)
          (cd "$GITHUB_WORKSPACE" && python3 scripts/apply_a2_a5_integrated.py)
          export PATH="$GITHUB_WORKSPACE/bde-tools/bin:$PATH"
          eval "$(bbs_build_env -u opt_dbg_64_cpp17)"
          export CFLAGS="${CFLAGS:-} -fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
          export CXXFLAGS="${CXXFLAGS:-} -fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
          export LDFLAGS="${LDFLAGS:-} -fsanitize=${{ matrix.sanitizer }}"
          echo "SANITIZER=${{ matrix.sanitizer }} CXXFLAGS=$CXXFLAGS LDFLAGS=$LDFLAGS"
          bbs_build configure --regex ball_loggermanager
          bbs_build build --target ball_loggermanager.t --tests build
          BIN="$(find _build -type f -name 'ball_loggermanager.t' -print -quit)"
          test -n "$BIN"
          echo "Sanitizer symbols in test binary:"
          nm -D "$BIN" | grep -E '__asan_init|__ubsan_handle' | head -n 8
          "$BIN" 995
          echo "ACTUAL_BDE_SINGLE_SANITIZER_PASS=${{ matrix.sanitizer }}"
