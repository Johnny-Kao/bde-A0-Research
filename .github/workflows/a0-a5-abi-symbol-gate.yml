name: ABI symbol compatibility gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bloomberg/bde
          ref: 75dcd617380748053bebb30aa6ca73735677e849
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bloomberg/bde-tools
          path: bde-tools
          persist-credentials: false
      - name: Compare ABI exposed symbols and link-compatible component
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/abi"
          export PATH="$GITHUB_WORKSPACE/bde-tools/bin:$PATH"
          eval "$(bbs_build_env -u opt_dbg_64_cpp17)"
          bbs_build configure --regex ball_loggermanager
          bbs_build build --target ball_loggermanager.t --tests build
          BASE="$(find _build -type f -name ball_loggermanager.t -print -quit)"
          test -n "$BASE"
          nm -C "$BASE" | awk '/ [TW] bloomberg::ball::LoggerManager::/ {print substr($0,index($0,"bloomberg::"))}' | sort -u > "$GITHUB_WORKSPACE/abi/baseline-symbols.txt"
          test -s "$GITHUB_WORKSPACE/abi/baseline-symbols.txt"
          cp "$BASE" "$GITHUB_WORKSPACE/abi/baseline-executable"
          (cd "$GITHUB_WORKSPACE" && python3 scripts/apply_a0_to_bde.py)
          (cd "$GITHUB_WORKSPACE" && python3 scripts/apply_a1_guard.py)
          (cd "$GITHUB_WORKSPACE" && python3 scripts/apply_a2_a5_integrated.py)
          (cd "$GITHUB_WORKSPACE" && python3 scripts/apply_abi_neutral_epoch.py)
          git diff --exit-code -- groups/bal/ball/ball_loggermanager.h
          bbs_build build --target ball_loggermanager.t --tests build
          BIN="$(find _build -type f -name ball_loggermanager.t -print -quit)"
          nm -C "$BIN" | awk '/ [TW] bloomberg::ball::LoggerManager::/ {print substr($0,index($0,"bloomberg::"))}' | sort -u > "$GITHUB_WORKSPACE/abi/candidate-symbols.txt"
          test -s "$GITHUB_WORKSPACE/abi/candidate-symbols.txt"
          diff -u "$GITHUB_WORKSPACE/abi/baseline-symbols.txt" "$GITHUB_WORKSPACE/abi/candidate-symbols.txt"
          "$BIN" 1
          echo "ABI_SYMBOL_SURFACE_MATCH_PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abi-evidence
          path: abi/*symbols.txt
          retention-days: 7
